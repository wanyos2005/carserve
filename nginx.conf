events { }

http {
    server {
        listen 8000;

        # Shared CORS setup
        add_header 'Access-Control-Allow-Origin' * always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' * always;

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Users service
        location /users/ {
            proxy_pass http://user-service:8001/;
        }
        # Vehicles service
        location /vehicles {
            proxy_pass http://vehicle-service:8002;
        }
        # Service Providers service
        location /service-providers/ {
            proxy_pass http://service-provider:8003/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        # Booking service
        location /bookings {
            proxy_pass http://booking-service:8004;
        }
        # Service logs (same service, new route)
        location /service-logs {
            proxy_pass http://booking-service:8004;
        }
        # Insurance service
        location /insurance {
            proxy_pass http://insurance-service:8005;
        }
        # Fallback
        location / {
            return 404;
        } 

        
    }
}

