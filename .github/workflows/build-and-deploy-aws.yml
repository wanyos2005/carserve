name: build-and-deploy-aws

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NS: ghcr.io/wanyos2005
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push user-service
        run: |
          docker buildx build \
            -f backend/user_service/Dockerfile.prod \
            -t $IMAGE_NS/user-service:latest \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push backend/user_service
      - name: Build and push vehicle-service
        run: |
          docker buildx build \
            -f backend/vehicle_service/Dockerfile.prod \
            -t $IMAGE_NS/vehicle-service:latest \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push backend/vehicle_service
      - name: Build and push service-provider
        run: |
          docker buildx build \
            -f backend/service_provider_service/Dockerfile.prod \
            -t $IMAGE_NS/service-provider:latest \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push backend/service_provider_service
      - name: Build and push booking-service
        run: |
          docker buildx build \
            -f backend/booking_service/Dockerfile.prod \
            -t $IMAGE_NS/booking-service:latest \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push backend/booking_service
      - name: Build and push insurance-service
        run: |
          docker buildx build \
            -f backend/insurance_service/Dockerfile.prod \
            -t $IMAGE_NS/insurance-service:latest \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push backend/insurance_service
      - name: Build and push alert-service
        run: |
          docker buildx build \
            -f backend/alert_service/Dockerfile.prod \
            -t $IMAGE_NS/alert-service:latest \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push backend/alert_service
      - name: Build and push expenses-service
        run: |
          docker buildx build \
            -f backend/expenses_service/Dockerfile.prod \
            -t $IMAGE_NS/expenses-service:latest \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push backend/expenses_service
      - name: Build and push social-service
        run: |
          docker buildx build \
            -f backend/social_service/Dockerfile.prod \
            -t $IMAGE_NS/social-service:latest \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push backend/social_service
      - name: Build and push alert-worker
        run: |
          docker buildx build \
            -f backend/alert_service/Dockerfile.prod \
            -t $IMAGE_NS/alert-worker:latest \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push backend/alert_service
      - name: Build and push alert-beat
        run: |
          docker buildx build \
            -f backend/alert_service/Dockerfile.prod \
            -t $IMAGE_NS/alert-beat:latest \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push backend/alert_service

  deploy-aws:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy to AWS via SSH
        uses: appleboy/ssh-action@v1
        env:
          REPO_SSH_URL: ${{ secrets.REPO_SSH_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          SMTP_TLS: ${{ secrets.SMTP_TLS }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_TLS: ${{ secrets.MAIL_TLS }}
          MAIL_SSL: ${{ secrets.MAIL_SSL }}
          SMS_PROVIDER: ${{ secrets.SMS_PROVIDER }}
          AT_USERNAME: ${{ secrets.AT_USERNAME }}
          AT_API_KEY: ${{ secrets.AT_API_KEY }}
          AT_SENDER_ID: ${{ secrets.AT_SENDER_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          FCM_SERVER_KEY: ${{ secrets.FCM_SERVER_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_BUCKET: ${{ secrets.CLOUDFLARE_BUCKET }}
          CLOUDFLARE_PUBLIC_URL: ${{ secrets.CLOUDFLARE_PUBLIC_URL }}
          MODERATION_API_KEY: ${{ secrets.MODERATION_API_KEY }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          command_timeout: 40m
          envs: REPO_SSH_URL,NEON_DATABASE_URL,UPSTASH_REDIS_URL,UPSTASH_REDIS_REST_URL,UPSTASH_REDIS_REST_TOKEN,JWT_SECRET_KEY,ALLOWED_ORIGINS,SMTP_HOST,SMTP_PORT,SMTP_USERNAME,SMTP_PASSWORD,SMTP_FROM_EMAIL,SMTP_FROM_NAME,SMTP_TLS,SMTP_SSL,MAIL_SERVER,MAIL_PORT,MAIL_USERNAME,MAIL_PASSWORD,MAIL_FROM,MAIL_FROM_NAME,MAIL_TLS,MAIL_SSL,SMS_PROVIDER,AT_USERNAME,AT_API_KEY,AT_SENDER_ID,TWILIO_ACCOUNT_SID,TWILIO_AUTH_TOKEN,TWILIO_PHONE_NUMBER,FCM_SERVER_KEY,CLOUDFLARE_ACCOUNT_ID,CLOUDFLARE_ACCESS_KEY_ID,CLOUDFLARE_SECRET_ACCESS_KEY,CLOUDFLARE_BUCKET,CLOUDFLARE_PUBLIC_URL,MODERATION_API_KEY
          script: |
            set -e
            # Prepare host
            sudo apt update
            sudo apt install -y docker.io docker-compose-plugin git

            # Ensure docker group permissions
            if ! groups $USER | grep -q docker; then
              sudo usermod -aG docker $USER || true
            fi

            # Clone/update repo directory
            sudo mkdir -p /opt/car-platform
            sudo chown -R ubuntu:ubuntu /opt/car-platform
            cd /opt/car-platform

            if [ -d .git ]; then
              git fetch --all
              git reset --hard origin/main
            else
              git init
              git remote add origin "$REPO_SSH_URL"
              git fetch --depth=1 origin main
              git checkout -f main
            fi

            # Generate production .env file from GitHub Secrets
            echo "Generating .env from secrets..."
            touch .env
            chmod 600 .env
            cat > .env << 'EOF'
# Production Environment Configuration for AWS

# External Database URLs
NEON_DATABASE_URL=$NEON_DATABASE_URL
UPSTASH_REDIS_URL=$UPSTASH_REDIS_URL
UPSTASH_REDIS_REST_URL=$UPSTASH_REDIS_REST_URL
UPSTASH_REDIS_REST_TOKEN=$UPSTASH_REDIS_REST_TOKEN

# Internal Database URLs (used by docker-compose.aws.yml services)
DATABASE_URL=postgresql+psycopg2://AdminDb:Ngojakwanza@postgres:5432/car_platform
DB_HOST=postgres
DB_NAME=car_platform
DB_USER=AdminDb
DB_PASSWORD=Ngojakwanza
REDIS_HOST=redis
REDIS_URL=redis://redis:6379/0

# JWT Configuration
JWT_SECRET_KEY=$JWT_SECRET_KEY
JWT_ALGORITHM=HS256
JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30

# CORS Configuration
ALLOWED_ORIGINS=$ALLOWED_ORIGINS

# Email settings
SMTP_HOST=$SMTP_HOST
SMTP_PORT=$SMTP_PORT
SMTP_USERNAME=$SMTP_USERNAME
SMTP_PASSWORD=$SMTP_PASSWORD
SMTP_FROM_EMAIL=$SMTP_FROM_EMAIL
SMTP_FROM_NAME=$SMTP_FROM_NAME
SMTP_TLS=$SMTP_TLS
SMTP_SSL=$SMTP_SSL

# Mail settings (user service mailconfig.py)
MAIL_SERVER=$MAIL_SERVER
MAIL_PORT=$MAIL_PORT
MAIL_USERNAME=$MAIL_USERNAME
MAIL_PASSWORD=$MAIL_PASSWORD
MAIL_FROM=$MAIL_FROM
MAIL_FROM_NAME=$MAIL_FROM_NAME
MAIL_TLS=$MAIL_TLS
MAIL_SSL=$MAIL_SSL

# SMS Configuration
SMS_PROVIDER=$SMS_PROVIDER
AT_USERNAME=$AT_USERNAME
AT_API_KEY=$AT_API_KEY
AT_SENDER_ID=$AT_SENDER_ID

# Twilio (optional)
TWILIO_ACCOUNT_SID=$TWILIO_ACCOUNT_SID
TWILIO_AUTH_TOKEN=$TWILIO_AUTH_TOKEN
TWILIO_PHONE_NUMBER=$TWILIO_PHONE_NUMBER

# Push Notifications
FCM_SERVER_KEY=$FCM_SERVER_KEY

# Environment
ENVIRONMENT=production
LOG_LEVEL=INFO

# Service URLs (internal, used by services)
USER_SERVICE_URL=http://user-service:8001
BOOKING_SERVICE_URL=http://booking-service:8004
INSURANCE_SERVICE_URL=http://insurance-service:8005
SOCIAL_SERVICE_URL=http://social-service:8008

# Celery (Upstash redis)
CELERY_BROKER_URL=${{ secrets.UPSTASH_REDIS_URL }}/0
CELERY_RESULT_BACKEND=${{ secrets.UPSTASH_REDIS_URL }}/1

# Social Service Configuration
SOCIAL_SERVICE_PORT=8008
ENABLE_CONTENT_MODERATION=true
ENABLE_ANALYTICS=true
ENABLE_NOTIFICATIONS=true
RATE_LIMIT_ENABLED=true
MEDIA_STORAGE_TYPE=cloudflare
MEDIA_UPLOAD_PATH=/app/uploads
MAX_FILE_SIZE=104857600
ALLOWED_IMAGE_TYPES=image/jpeg,image/png,image/gif,image/webp
ALLOWED_VIDEO_TYPES=video/mp4,video/webm,video/quicktime
ANALYTICS_RETENTION_DAYS=90
RATE_LIMIT_REQUESTS_PER_MINUTE=60
PUSH_NOTIFICATION_ENABLED=true

# Cloudflare R2
CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID
CLOUDFLARE_ACCESS_KEY_ID=$CLOUDFLARE_ACCESS_KEY_ID
CLOUDFLARE_SECRET_ACCESS_KEY=$CLOUDFLARE_SECRET_ACCESS_KEY
CLOUDFLARE_BUCKET=$CLOUDFLARE_BUCKET
CLOUDFLARE_PUBLIC_URL=$CLOUDFLARE_PUBLIC_URL

# Content Moderation
MODERATION_API_KEY=$MODERATION_API_KEY
EOF

            chmod 600 .env

            # Docker daemon tuning (safe defaults for small VM)
            sudo mkdir -p /etc/docker
            echo '{"max-concurrent-downloads": 1, "max-concurrent-uploads": 1, "max-download-attempts": 10, "log-driver": "json-file", "log-opts": {"max-size": "10m", "max-file": "3"}}' | sudo tee /etc/docker/daemon.json
            sudo systemctl restart docker || true
            sleep 10

            # Pull images with retry
            pull_img() {
              img=$1; name=$2; for i in $(seq 1 6); do echo "Pull $name attempt $i"; if timeout 600 docker pull "$img"; then echo "Pulled $name"; return 0; fi; sleep 30; done; echo "Failed to pull $name"; return 1;
            }

            pull_img ghcr.io/wanyos2005/user-service:latest user-service || true
            pull_img ghcr.io/wanyos2005/vehicle-service:latest vehicle-service || true
            pull_img ghcr.io/wanyos2005/booking-service:latest booking-service || true
            pull_img ghcr.io/wanyos2005/insurance-service:latest insurance-service || true
            pull_img ghcr.io/wanyos2005/expenses-service:latest expenses-service || true
            pull_img ghcr.io/wanyos2005/service-provider:latest service-provider || true
            pull_img ghcr.io/wanyos2005/alert-service:latest alert-service || true
            pull_img ghcr.io/wanyos2005/alert-worker:latest alert-worker || true
            pull_img ghcr.io/wanyos2005/alert-beat:latest alert-beat || true
            pull_img ghcr.io/wanyos2005/social-service:latest social-service || true

            # Bring up services
            docker compose -f docker-compose.aws.yml up -d --remove-orphans

            echo "Waiting 20s for services..."; sleep 20
            docker compose -f docker-compose.aws.yml ps
            docker logs --tail=50 gateway || true

