name: Deploy FastAPI via SSM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run deployment commands on EC2 via SSM
        uses: aws-actions/aws-ssm-run-command@v2
        with:
          targets: "InstanceIds=i-0ec6c2b1be34e3c5f"  # Your EC2 instance ID
          document-name: "AWS-RunShellScript"
          parameters: |
            commands=[
              "cd ~/carserve",
              "git pull origin main",
              "echo 'Generating .env from SSM...'",
              "python3 generate_env_from_ssm1.py",
              "docker compose -f docker-compose.aws.yml pull",
              "docker compose -f docker-compose.aws.yml up -d --build",
              "docker system prune -f"
            ]
