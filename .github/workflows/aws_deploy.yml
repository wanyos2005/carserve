name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          # Create SSH directory
          mkdir -p ~/.ssh

          # Save the SSH private key from GitHub Secrets
          printf "%s" "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/fastapi-key.pem
          chmod 600 ~/.ssh/fastapi-key.pem

          # Add remote host to known_hosts to avoid SSH prompts
          ssh-keyscan -H ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts || true


      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/fastapi-key.pem ubuntu@${{ secrets.AWS_HOST }} <<'EOF'
            cd ~/carserve
            git pull origin main

            echo "Generating .env from SSM..."
            python3 generate_env_from_ssm1.py

            docker compose -f docker-compose.aws.yml pull
            docker compose -f docker-compose.aws.yml up -d --build
            docker system prune -f
          EOF
