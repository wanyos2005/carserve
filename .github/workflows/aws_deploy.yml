name: Deploy FastAPI via SSM

on:
  push:
    branches:
      - main

jobs:
  build-payment-service:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push payment-service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/payment_service
          push: true
          tags: ghcr.io/wanyos2005/payment-service:latest

      - name: Build and push payment-worker
        uses: docker/build-push-action@v5
        with:
          context: ./backend/payment_service
          push: true
          tags: ghcr.io/wanyos2005/payment-worker:latest

  deploy:
    needs: build-payment-service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "--- Starting deployment on VPS ---"
            cd /home/carserve

            echo "--- Pulling latest code ---"
            git stash || true
            git pull origin main

            echo "--- Pulling updated images ---"
            docker compose -f docker-compose.aws.yml pull --ignore-pull-failures

            echo "--- Restarting services ---"
            docker compose -f docker-compose.aws.yml up -d --build

            echo "--- Cleaning up ---"
            docker system prune -f

            echo "--- Deployment complete ---"
