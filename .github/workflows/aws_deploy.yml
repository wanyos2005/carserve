name: Deploy FastAPI via SSM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via env
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "✅ AWS credentials set in environment"

      - name: Trigger deployment on EC2 via SSM
        id: deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "🚀 Sending deployment command to EC2 via SSM..."

          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=InstanceIds,Values=i-0ec6c2b1be34e3c5f" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy FastAPI using instance role" \
            --parameters "commands=[
              'set -e',
              'export HOME=/home/ubuntu',
              'echo --- Starting deployment on EC2 ---',
              'cd /home/ubuntu/carserve || exit 1',
              'echo --- Fixing git safe directory ownership ---',
              'git config --system --add safe.directory /home/ubuntu/carserve || true',
              'echo --- Installing Python dependencies ---',
              'sudo apt-get update -y',
              'sudo apt-get install -y python3-pip || true',
              'pip install boto3 || true',
              'echo --- Generating .env from SSM ---',
              'python3 generate_env_from_ssm1.py || (echo Failed to generate .env; exit 1)',
              'echo --- Cleaning invalid env lines ---',
              'grep -v \"M1J2eEhWuw360DBh7F_Z14/8KNUAEaVwzTk39E_P1z4ZINNaWA9_5w==\" /home/ubuntu/carserve/.env > /home/ubuntu/carserve/.env.tmp && mv /home/ubuntu/carserve/.env.tmp /home/ubuntu/carserve/.env',
              'if [ ! -f .env ]; then echo .env not found!; exit 1; fi',
              'echo --- Building containers ---',
              'docker compose -f docker-compose.aws.yml pull',
              'docker compose -f docker-compose.aws.yml up -d --build',
              'docker system prune -f -y',
              'echo --- Deployment complete ---'
            ]" \
            --region $AWS_DEFAULT_REGION \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Wait for SSM command to complete and fetch logs
        env:
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          STATUS="Pending"
          ATTEMPTS=0
          CMD_ID=${{ steps.deploy.outputs.command_id }}

          echo "⏳ Waiting for SSM command to finish..."

          while [[ "$STATUS" != "Success" && "$STATUS" != "Failed" ]]; do
            sleep 10
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$CMD_ID" \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)
            echo "Current SSM status: $STATUS"
            ATTEMPTS=$((ATTEMPTS+1))
            if [ "$ATTEMPTS" -gt 30 ]; then
              echo "❌ Timeout waiting for SSM command."
              exit 1
            fi
          done

          echo "===== 🧾 SSM Deployment Logs ====="
          # Use jq-safe formatting to avoid breaking on special characters
          aws ssm list-command-invocations \
            --command-id "$CMD_ID" \
            --details \
            --query "CommandInvocations[0].CommandPlugins[0].Output" \
            --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "❌ SSM deployment failed!"
            exit 1
          fi

          echo "✅ Deployment completed successfully!"
