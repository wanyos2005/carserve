name: build-and-deploy
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NS: ghcr.io/wanyos2005
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push user-service
        run: |
          docker buildx build \
            -f backend/user_service/Dockerfile.prod \
            -t $IMAGE_NS/user-service:latest \
            --platform linux/amd64 \
            --push backend/user_service
      - name: Build and push vehicle-service
        run: |
          docker buildx build \
            -f backend/vehicle_service/Dockerfile.prod \
            -t $IMAGE_NS/vehicle-service:latest \
            --platform linux/amd64 \
            --push backend/vehicle_service
      - name: Build and push service-provider
        run: |
          docker buildx build \
            -f backend/service_provider_service/Dockerfile.prod \
            -t $IMAGE_NS/service-provider:latest \
            --platform linux/amd64 \
            --push backend/service_provider_service
      - name: Build and push booking-service
        run: |
          docker buildx build \
            -f backend/booking_service/Dockerfile.prod \
            -t $IMAGE_NS/booking-service:latest \
            --platform linux/amd64 \
            --push backend/booking_service
      - name: Build and push insurance-service
        run: |
          docker buildx build \
            -f backend/insurance_service/Dockerfile.prod \
            -t $IMAGE_NS/insurance-service:latest \
            --platform linux/amd64 \
            --push backend/insurance_service
      - name: Build and push alert-service
        run: |
          docker buildx build \
            -f backend/alert_service/Dockerfile.prod \
            -t $IMAGE_NS/alert-service:latest \
            --platform linux/amd64 \
            --push backend/alert_service
      - name: Build and push expenses-service
        run: |
          docker buildx build \
            -f backend/expenses_service/Dockerfile.prod \
            -t $IMAGE_NS/expenses-service:latest \
            --platform linux/amd64 \
            --push backend/expenses_service
      - name: Build and push alert-worker
        run: |
          docker buildx build \
            -f backend/alert_service/Dockerfile.prod \
            -t $IMAGE_NS/alert-worker:latest \
            --platform linux/amd64 \
            --push backend/alert_service
      - name: Build and push alert-beat
        run: |
          docker buildx build \
            -f backend/alert_service/Dockerfile.prod \
            -t $IMAGE_NS/alert-beat:latest \
            --platform linux/amd64 \
            --push backend/alert_service

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd /opt/car-platform
            git fetch --all
            git reset --hard origin/main
            
            # Configure Docker for better network handling
            sudo mkdir -p /etc/docker
            echo '{"max-concurrent-downloads": 1, "max-concurrent-uploads": 1}' | sudo tee /etc/docker/daemon.json
            sudo systemctl restart docker
            sleep 10
            
            # Pull images with retry logic
            echo "Pulling images with retries..."
            for i in {1..3}; do
              echo "Attempt $i..."
              if docker pull ghcr.io/wanyos2005/user-service:latest; then
                echo "✓ user-service pulled successfully"
                break
              else
                echo "✗ user-service failed, retrying..."
                sleep 30
              fi
            done
            
            for i in {1..3}; do
              echo "Attempt $i..."
              if docker pull ghcr.io/wanyos2005/vehicle-service:latest; then
                echo "✓ vehicle-service pulled successfully"
                break
              else
                echo "✗ vehicle-service failed, retrying..."
                sleep 30
              fi
            done
            
            for i in {1..3}; do
              echo "Attempt $i..."
              if docker pull ghcr.io/wanyos2005/booking-service:latest; then
                echo "✓ booking-service pulled successfully"
                break
              else
                echo "✗ booking-service failed, retrying..."
                sleep 30
              fi
            done
            
            for i in {1..3}; do
              echo "Attempt $i..."
              if docker pull ghcr.io/wanyos2005/insurance-service:latest; then
                echo "✓ insurance-service pulled successfully"
                break
              else
                echo "✗ insurance-service failed, retrying..."
                sleep 30
              fi
            done
            
            for i in {1..3}; do
              echo "Attempt $i..."
              if docker pull ghcr.io/wanyos2005/expenses-service:latest; then
                echo "✓ expenses-service pulled successfully"
                break
              else
                echo "✗ expenses-service failed, retrying..."
                sleep 30
              fi
            done
            
            for i in {1..3}; do
              echo "Attempt $i..."
              if docker pull ghcr.io/wanyos2005/service-provider:latest; then
                echo "✓ service-provider pulled successfully"
                break
              else
                echo "✗ service-provider failed, retrying..."
                sleep 30
              fi
            done
            
            for i in {1..3}; do
              echo "Attempt $i..."
              if docker pull ghcr.io/wanyos2005/alert-service:latest; then
                echo "✓ alert-service pulled successfully"
                break
              else
                echo "✗ alert-service failed, retrying..."
                sleep 30
              fi
            done
            
            # Start services
            echo "Starting services..."
            docker compose -f docker-compose.oracle.yml up -d
            docker compose -f docker-compose.oracle.yml ps