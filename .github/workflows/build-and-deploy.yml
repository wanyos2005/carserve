name: build-and-deploy
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NS: ghcr.io/wanyos2005
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push user-service
        run: |
          docker buildx build \
            -f backend/user_service/Dockerfile.prod \
            -t $IMAGE_NS/user-service:latest \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push backend/user_service
      - name: Build and push vehicle-service
        run: |
          docker buildx build \
            -f backend/vehicle_service/Dockerfile.prod \
            -t $IMAGE_NS/vehicle-service:latest \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push backend/vehicle_service
      - name: Build and push service-provider
        run: |
          docker buildx build \
            -f backend/service_provider_service/Dockerfile.prod \
            -t $IMAGE_NS/service-provider:latest \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push backend/service_provider_service
      - name: Build and push booking-service
        run: |
          docker buildx build \
            -f backend/booking_service/Dockerfile.prod \
            -t $IMAGE_NS/booking-service:latest \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push backend/booking_service
      - name: Build and push insurance-service
        run: |
          docker buildx build \
            -f backend/insurance_service/Dockerfile.prod \
            -t $IMAGE_NS/insurance-service:latest \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push backend/insurance_service
      - name: Build and push alert-service
        run: |
          docker buildx build \
            -f backend/alert_service/Dockerfile.prod \
            -t $IMAGE_NS/alert-service:latest \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push backend/alert_service
      - name: Build and push expenses-service
        run: |
          docker buildx build \
            -f backend/expenses_service/Dockerfile.prod \
            -t $IMAGE_NS/expenses-service:latest \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push backend/expenses_service
      - name: Build and push social-service
        run: |
          docker buildx build \
            -f backend/social_service/Dockerfile.prod \
            -t $IMAGE_NS/social-service:latest \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push backend/social_service
      - name: Build and push alert-worker
        run: |
          docker buildx build \
            -f backend/alert_service/Dockerfile.prod \
            -t $IMAGE_NS/alert-worker:latest \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push backend/alert_service
      - name: Build and push alert-beat
        run: |
          docker buildx build \
            -f backend/alert_service/Dockerfile.prod \
            -t $IMAGE_NS/alert-beat:latest \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push backend/alert_service

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          SMTP_TLS: ${{ secrets.SMTP_TLS }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_TLS: ${{ secrets.MAIL_TLS }}
          MAIL_SSL: ${{ secrets.MAIL_SSL }}
          SMS_PROVIDER: ${{ secrets.SMS_PROVIDER }}
          AT_USERNAME: ${{ secrets.AT_USERNAME }}
          AT_API_KEY: ${{ secrets.AT_API_KEY }}
          AT_SENDER_ID: ${{ secrets.AT_SENDER_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          FCM_SERVER_KEY: ${{ secrets.FCM_SERVER_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_BUCKET: ${{ secrets.CLOUDFLARE_BUCKET }}
          CLOUDFLARE_PUBLIC_URL: ${{ secrets.CLOUDFLARE_PUBLIC_URL }}
          MODERATION_API_KEY: ${{ secrets.MODERATION_API_KEY }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 40m
          envs: NEON_DATABASE_URL,UPSTASH_REDIS_URL,UPSTASH_REDIS_REST_URL,UPSTASH_REDIS_REST_TOKEN,JWT_SECRET_KEY,ALLOWED_ORIGINS,SMTP_HOST,SMTP_PORT,SMTP_USERNAME,SMTP_PASSWORD,SMTP_FROM_EMAIL,SMTP_FROM_NAME,SMTP_TLS,SMTP_SSL,MAIL_SERVER,MAIL_PORT,MAIL_USERNAME,MAIL_PASSWORD,MAIL_FROM,MAIL_FROM_NAME,MAIL_TLS,MAIL_SSL,SMS_PROVIDER,AT_USERNAME,AT_API_KEY,AT_SENDER_ID,TWILIO_ACCOUNT_SID,TWILIO_AUTH_TOKEN,TWILIO_PHONE_NUMBER,FCM_SERVER_KEY,CLOUDFLARE_ACCOUNT_ID,CLOUDFLARE_ACCESS_KEY_ID,CLOUDFLARE_SECRET_ACCESS_KEY,CLOUDFLARE_BUCKET,CLOUDFLARE_PUBLIC_URL,MODERATION_API_KEY,GRAFANA_PASSWORD
          script: |
            set -e
            cd /opt/car-platform
            git fetch --all #this is to fetch the latest changes from the remote repository
            git reset --hard origin/main #this is to reset the local repository to the latest changes from the remote repository
            
            # Generate production .env file from GitHub Secrets
            echo "🔧 Generating production .env file from secrets..."
            
            # Create .env with restricted permissions
            touch .env
            chmod 600 .env
            chown root:root .env
            
            cat > .env << 'EOF'
# Production Environment Configuration
# Generated from GitHub Secrets during CI/CD deployment

# External Database URLs
NEON_DATABASE_URL=$NEON_DATABASE_URL
UPSTASH_REDIS_URL=$UPSTASH_REDIS_URL
UPSTASH_REDIS_REST_URL=$UPSTASH_REDIS_REST_URL
UPSTASH_REDIS_REST_TOKEN=$UPSTASH_REDIS_REST_TOKEN

# Internal Database URLs (for reference - not used in prod)
DATABASE_URL=postgresql+psycopg2://AdminDb:Ngojakwanza@postgres:5432/car_platform
DB_HOST=postgres
DB_NAME=car_platform
DB_USER=AdminDb
DB_PASSWORD=Ngojakwanza
REDIS_HOST=redis

# JWT Configuration
JWT_SECRET_KEY=$JWT_SECRET_KEY
JWT_ALGORITHM=HS256
JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30

# CORS Configuration
ALLOWED_ORIGINS=$ALLOWED_ORIGINS

# Email settings
SMTP_HOST=$SMTP_HOST
SMTP_PORT=$SMTP_PORT
SMTP_USERNAME=$SMTP_USERNAME
SMTP_PASSWORD=$SMTP_PASSWORD
SMTP_FROM_EMAIL=$SMTP_FROM_EMAIL
SMTP_FROM_NAME=$SMTP_FROM_NAME
SMTP_TLS=$SMTP_TLS
SMTP_SSL=$SMTP_SSL

# Mail settings (for user service mailconfig.py)
MAIL_SERVER=$MAIL_SERVER
MAIL_PORT=$MAIL_PORT
MAIL_USERNAME=$MAIL_USERNAME
MAIL_PASSWORD=$MAIL_PASSWORD
MAIL_FROM=$MAIL_FROM
MAIL_FROM_NAME=$MAIL_FROM_NAME
MAIL_TLS=$MAIL_TLS
MAIL_SSL=$MAIL_SSL

# SMS Configuration
SMS_PROVIDER=$SMS_PROVIDER
AT_USERNAME=$AT_USERNAME
AT_API_KEY=$AT_API_KEY
AT_SENDER_ID=$AT_SENDER_ID

# Twilio Configuration (for SMS alternative)
TWILIO_ACCOUNT_SID=$TWILIO_ACCOUNT_SID
TWILIO_AUTH_TOKEN=$TWILIO_AUTH_TOKEN
TWILIO_PHONE_NUMBER=$TWILIO_PHONE_NUMBER

# Push Notifications
FCM_SERVER_KEY=$FCM_SERVER_KEY

# Environment
ENVIRONMENT=production
LOG_LEVEL=INFO

# Service URLs (internal)
USER_SERVICE_URL=http://user-service:8001
BOOKING_SERVICE_URL=http://booking-service:8004
INSURANCE_SERVICE_URL=http://insurance-service:8005
SOCIAL_SERVICE_URL=http://social-service:8008

# Celery Configuration
CELERY_BROKER_URL=${{ secrets.UPSTASH_REDIS_URL }}/0
CELERY_RESULT_BACKEND=${{ secrets.UPSTASH_REDIS_URL }}/1

# Social Service Configuration
SOCIAL_SERVICE_PORT=8008
ENABLE_CONTENT_MODERATION=true
ENABLE_ANALYTICS=true
ENABLE_NOTIFICATIONS=true
RATE_LIMIT_ENABLED=true
MEDIA_STORAGE_TYPE=cloudflare
MEDIA_UPLOAD_PATH=/app/uploads
MAX_FILE_SIZE=104857600
ALLOWED_IMAGE_TYPES=image/jpeg,image/png,image/gif,image/webp
ALLOWED_VIDEO_TYPES=video/mp4,video/webm,video/quicktime
ANALYTICS_RETENTION_DAYS=90
RATE_LIMIT_REQUESTS_PER_MINUTE=60
PUSH_NOTIFICATION_ENABLED=true

# Cloudflare R2 Configuration
CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID
CLOUDFLARE_ACCESS_KEY_ID=$CLOUDFLARE_ACCESS_KEY_ID
CLOUDFLARE_SECRET_ACCESS_KEY=$CLOUDFLARE_SECRET_ACCESS_KEY
CLOUDFLARE_BUCKET=$CLOUDFLARE_BUCKET
CLOUDFLARE_PUBLIC_URL=$CLOUDFLARE_PUBLIC_URL

# Content Moderation
MODERATION_API_KEY=$MODERATION_API_KEY

# Monitoring
GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}
EOF
            
            # Additional security measures
            chmod 600 .env
            chown root:root .env

            sudo chmod 640 .env
            sudo chown root:docker .env
            
            # Remove .env from git tracking (if it exists)
            git rm --cached .env 2>/dev/null || true
            echo ".env" >> .gitignore
            
            # Set up log rotation to prevent sensitive data in logs
            echo "*.log {
                daily
                missingok
                rotate 7
                compress
                notifempty
                create 644 root root
            }" | sudo tee /etc/logrotate.d/car-platform
            
            # Install security monitoring tools
            echo "🔒 Setting up security monitoring..."
            sudo apt update
            sudo apt install -y fail2ban aide ufw
            
            # Configure fail2ban for SSH protection
            sudo tee /etc/fail2ban/jail.local << 'EOF'
[DEFAULT]
bantime = 3600
findtime = 600
maxretry = 3

[sshd]
enabled = true
port = ssh
logpath = /var/log/auth.log
maxretry = 3
bantime = 3600
EOF
            
            # Configure AIDE for file integrity monitoring
            sudo aideinit
            sudo mv /var/lib/aide/aide.db.new /var/lib/aide/aide.db
            
            # Set up UFW firewall, ufw is short form of Uncomplicated Firewall,used to block unwanted traffic to the server.
            sudo ufw --force enable
            sudo ufw default deny incoming 
            sudo ufw default allow outgoing
            sudo ufw allow ssh
            sudo ufw allow 80/tcp #
            sudo ufw allow 443/tcp
            
            # Start security services
            sudo systemctl enable fail2ban
            sudo systemctl start fail2ban
            sudo systemctl enable aide
            sudo systemctl start aide
            
            echo "✅ Security monitoring and hardening configured"
            
            # Configure Docker for better network handling
            sudo mkdir -p /etc/docker
            echo '{"max-concurrent-downloads": 1, "max-concurrent-uploads": 1, "max-download-attempts": 10, "registry-mirrors": [], "insecure-registries": [], "dns": ["8.8.8.8", "8.8.4.4"]}' | sudo tee /etc/docker/daemon.json
            sudo systemctl restart docker
            sleep 20
            
            # Pull images with retry logic and timeouts
            echo "Pulling images with retries..."
            
            # Function to pull image with retries
            pull_image() {
              local image=$1
              local service_name=$2
              for i in {1..8}; do
                echo "Attempt $i for $service_name..."
                if timeout 600 docker pull $image; then
                  echo "✓ $service_name pulled successfully"
                  return 0
                else
                  echo "✗ $service_name failed, retrying in 90s..."
                  sleep 90
                fi
              done
              echo "✗ $service_name failed after 8 attempts"
              return 1
            }
            
            # Pull all images
            pull_image "ghcr.io/wanyos2005/user-service:latest" "user-service"
            
            pull_image "ghcr.io/wanyos2005/vehicle-service:latest" "vehicle-service"
            pull_image "ghcr.io/wanyos2005/booking-service:latest" "booking-service"
            pull_image "ghcr.io/wanyos2005/insurance-service:latest" "insurance-service"
            pull_image "ghcr.io/wanyos2005/expenses-service:latest" "expenses-service"
            pull_image "ghcr.io/wanyos2005/service-provider:latest" "service-provider"
            pull_image "ghcr.io/wanyos2005/alert-service:latest" "alert-service"
            pull_image "ghcr.io/wanyos2005/social-service:latest" "social-service"
            
           
            
            # Note: Database migrations are handled manually using bootstrap_migrations.sh
            echo "Skipping database migrations - handled manually"
            
            # Start services with better error handling
            echo "Starting services..."
            docker compose -f docker-compose.oracle.yml up -d --remove-orphans
            
            # Wait for services to be ready
            echo "Waiting for services to be ready..."
            sleep 30
            
            # Check service status
            echo "Service status:"
            docker compose -f docker-compose.oracle.yml ps
            
            # Check logs for any startup issues
            echo "Checking for startup issues..."
            docker compose -f docker-compose.oracle.yml logs --tail=50 user-service
            docker compose -f docker-compose.oracle.yml logs --tail=50 vehicle-service
            docker compose -f docker-compose.oracle.yml logs --tail=50 booking-service