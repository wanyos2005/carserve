# Development overrides for docker-compose.prod.yml
# This file is automatically loaded by docker-compose when present
# Use this for development-specific configurations

version: '3.8'

services:
  # Override for development - enable hot reload
  user-service:
    volumes:
      - ./backend/user_service:/app
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  vehicle-service:
    volumes:
      - ./backend/vehicle_service:/app
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]

  service-provider:
    volumes:
      - ./backend/service_provider_service:/app
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8003", "--reload"]

  booking-service:
    volumes:
      - ./backend/booking_service:/app
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8004", "--reload"]

  insurance-service:
    volumes:
      - ./backend/insurance_service:/app
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8005", "--reload"]

  alert-service:
    volumes:
      - ./backend/alert_service:/app
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8006", "--reload"]

  expenses-service:
    volumes:
      - ./backend/expenses_service:/app
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8007", "--reload"]

  # Disable monitoring in development
  prometheus:
    profiles:
      - monitoring

  grafana:
    profiles:
      - monitoring
