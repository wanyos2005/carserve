worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 100m;

    # Docker internal DNS — resolves hostnames at request time, not at startup
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;
        client_max_body_size 100m;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' '*' always;

        if ($request_method = OPTIONS) { return 204; }

        location /health { return 200 "healthy\n"; add_header Content-Type text/plain; }

        location /api/users/ {
            set $upstream http://user-service:8001;
            rewrite ^/api/users/(.*) /$1 break;
            proxy_pass $upstream;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s; proxy_send_timeout 60s; proxy_read_timeout 60s;
        }

        location /api/service-providers/ {
            set $upstream http://service-provider:8003;
            rewrite ^/api/service-providers/(.*) /$1 break;
            proxy_pass $upstream;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s; proxy_send_timeout 60s; proxy_read_timeout 60s;
        }

        location /api/alerts/ {
            set $upstream http://alert-service:8006;
            rewrite ^/api/alerts/(.*) /$1 break;
            proxy_pass $upstream;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s; proxy_send_timeout 60s; proxy_read_timeout 60s;
        }

        location ~ ^/users/\d+/fcm-token$ {
            set $upstream http://user-service:8001;
            proxy_pass $upstream;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s; proxy_send_timeout 60s; proxy_read_timeout 60s;
        }

        location /users/ {
            set $upstream http://user-service:8001;
            rewrite ^/users/(.*) /$1 break;
            proxy_pass $upstream;
            client_max_body_size 100m;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s; proxy_send_timeout 60s; proxy_read_timeout 60s;
        }

        location /vehicles {
            set $upstream http://vehicle-service:8002;
            proxy_pass $upstream;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 30s; proxy_send_timeout 60s; proxy_read_timeout 60s;
        }

        location /service-providers/ {
            set $upstream http://service-provider:8003;
            rewrite ^/service-providers/(.*) /$1 break;
            proxy_pass $upstream;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s; proxy_send_timeout 60s; proxy_read_timeout 60s;
        }

        location /bookings/ {
            set $upstream http://booking-service:8004;
            rewrite ^/bookings/(.*) /bookings/$1 break;
            proxy_pass $upstream;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s; proxy_send_timeout 60s; proxy_read_timeout 60s;
        }

        location /service-logs/ {
            set $upstream http://booking-service:8004;
            rewrite ^/service-logs/(.*) /service-logs/$1 break;
            proxy_pass $upstream;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s; proxy_send_timeout 60s; proxy_read_timeout 60s;
        }

        location /booking-health {
            set $upstream http://booking-service:8004;
            rewrite ^/booking-health$ /health break;
            proxy_pass $upstream;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s; proxy_send_timeout 60s; proxy_read_timeout 60s;
        }

        location /insurance/ {
            set $upstream http://insurance-service:8005;
            rewrite ^/insurance/(.*) /insurance/$1 break;
            proxy_pass $upstream;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s; proxy_send_timeout 60s; proxy_read_timeout 60s;
        }

        location /expense/ {
            set $upstream http://expenses-service:8007;
            rewrite ^/expense/(.*) /expense/$1 break;
            proxy_pass $upstream;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s; proxy_send_timeout 60s; proxy_read_timeout 60s;
        }

        location /alerts/ {
            set $upstream http://alert-service:8006;
            rewrite ^/alerts/(.*) /$1 break;
            proxy_pass $upstream;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s; proxy_send_timeout 60s; proxy_read_timeout 60s;
        }

        location = /alerts {
            set $upstream http://alert-service:8006;
            rewrite ^/alerts$ /alerts break;
            proxy_pass $upstream;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s; proxy_send_timeout 60s; proxy_read_timeout 60s;
        }

        location /social/ws/ {
            set $upstream http://social-service:8008;
            rewrite ^/social/ws/(.*) /social/ws/$1 break;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s; proxy_send_timeout 60s;
        }

        location /social/ {
            set $upstream http://social-service:8008;
            rewrite ^/social/(.*) /social/$1 break;
            proxy_pass $upstream;
            client_max_body_size 100m;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 30s; proxy_send_timeout 300s; proxy_read_timeout 300s;
            client_body_timeout 300s; proxy_request_buffering off;
        }

        location /loyalty/ {
            set $upstream http://loyalty-service:8009;
            rewrite ^/loyalty/(.*) /loyalty/$1 break;
            proxy_pass $upstream;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s; proxy_send_timeout 60s; proxy_read_timeout 60s;
        }

        location /payment-service/mpesa/ {
            set $upstream http://payment-service:8010;
            rewrite ^/payment-service/mpesa/(.*) /mpesa/$1 break;
            proxy_pass $upstream;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s; proxy_send_timeout 60s; proxy_read_timeout 60s;
        }

        location /payment-service/webhooks {
            set $upstream http://payment-service:8010;
            rewrite ^/payment-service/webhooks(.*) /webhooks$1 break;
            proxy_pass $upstream;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s; proxy_send_timeout 60s; proxy_read_timeout 60s;
        }

        location /payment-service/daraja/ {
            set $upstream http://payment-service:8010;
            rewrite ^/payment-service/daraja/(.*) /daraja/$1 break;
            proxy_pass $upstream;
            proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s; proxy_send_timeout 60s; proxy_read_timeout 60s;
        }

        location / { return 404 '{"error":"Not Found"}'; add_header Content-Type application/json; }
    }
}
