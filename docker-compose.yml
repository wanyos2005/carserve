services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: AdminDb
      POSTGRES_PASSWORD: Ngojakwanza
      POSTGRES_DB: car_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U AdminDb -d car_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./backend/user_service
      dockerfile: Dockerfile
    volumes:
      - ./backend/user_service:/app
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+psycopg2://AdminDb:Ngojakwanza@postgres:5432/car_platform
      - DB_HOST=postgres
      - DB_NAME=car_platform
      - DB_USER=AdminDb
      - DB_PASSWORD=Ngojakwanza
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  vehicle-service:
    build:
      context: ./backend/vehicle_service
      dockerfile: Dockerfile
    volumes:
      - ./backend/vehicle_service:/app
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql+psycopg2://AdminDb:Ngojakwanza@postgres:5432/car_platform
      - DB_HOST=postgres
      - DB_NAME=car_platform
      - DB_USER=AdminDb
      - DB_PASSWORD=Ngojakwanza
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  service-provider:
    build:
      context: ./backend/service_provider_service
    volumes:
      - ./backend/service_provider_service:/app
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql+psycopg2://AdminDb:Ngojakwanza@postgres:5432/car_platform
      - DB_HOST=postgres
      - DB_NAME=car_platform
      - DB_USER=AdminDb
      - DB_PASSWORD=Ngojakwanza
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  booking-service:
    build:
      context: ./backend/booking_service
    volumes:
      - ./backend/booking_service:/app
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql+psycopg2://AdminDb:Ngojakwanza@postgres:5432/car_platform
      - DB_HOST=postgres
      - DB_NAME=car_platform
      - DB_USER=AdminDb
      - DB_PASSWORD=Ngojakwanza
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8004/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  insurance-service:
    build:
      context: ./backend/insurance_service
    volumes:
      - ./backend/insurance_service:/app
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=postgresql+psycopg2://AdminDb:Ngojakwanza@postgres:5432/car_platform
      - DB_HOST=postgres
      - DB_NAME=car_platform
      - DB_USER=AdminDb
      - DB_PASSWORD=Ngojakwanza
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8005/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  alert-service:
    build:
      context: ./backend/alert_service
    volumes:
      - ./backend/alert_service:/app
    ports:
      - "8006:8006"
    environment:
      - DATABASE_URL=postgresql+psycopg2://AdminDb:Ngojakwanza@postgres:5432/car_platform
      - REDIS_URL=redis://redis:6379
      - USER_SERVICE_URL=http://user-service:8001
      - BOOKING_SERVICE_URL=http://booking-service:8004
      - INSURANCE_SERVICE_URL=http://insurance-service:8005
      # Email settings (same as user service)
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=tastytasty101@gmail.com
      - SMTP_PASSWORD=degp zfga fqfp sifz
      - SMTP_FROM_EMAIL=tastytasty101@gmail.com
      - SMTP_FROM_NAME=DRIVEon.fit
      - SMTP_TLS=True
      - SMTP_SSL=False
      # Notification services (add when ready)
      - FCM_SERVER_KEY=${FCM_SERVER_KEY:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - ALLOWED_ORIGINS=http://localhost:3000,http://192.168.0.107:8081,http://192.168.2.116:8000*
      - SMS_PROVIDER=${SMS_PROVIDER:-africastalking}
      - AT_USERNAME=${AT_USERNAME:-sandbox}
      - AT_API_KEY=${AT_API_KEY:-atsk_f3f2b279ac069c0320e24f5ec82bdeafbb31c8212f9a5b7e9b7bd6b94bff46c10869c579}
      - AT_SENDER_ID=${AT_SENDER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      booking-service:
        condition: service_started
      insurance-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8006/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  alert-worker:
    build:
      context: ./backend/alert_service
    volumes:
      - ./backend/alert_service:/app
    environment:
      - DATABASE_URL=postgresql+psycopg2://AdminDb:Ngojakwanza@postgres:5432/car_platform
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - USER_SERVICE_URL=http://user-service:8001
      - BOOKING_SERVICE_URL=http://booking-service:8004
      - INSURANCE_SERVICE_URL=http://insurance-service:8005
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=tastytasty101@gmail.com
      - SMTP_PASSWORD=degp zfga fqfp sifz
      - SMTP_FROM_EMAIL=tastytasty101@gmail.com
      - SMTP_FROM_NAME=DRIVEon.fit
      - SMTP_TLS=True
      - SMTP_SSL=False
      - SMS_PROVIDER=${SMS_PROVIDER:-africastalking}
      - AT_USERNAME=${AT_USERNAME:-sandbox}
      - AT_API_KEY=${AT_API_KEY:-atsk_f3f2b279ac069c0320e24f5ec82bdeafbb31c8212f9a5b7e9b7bd6b94bff46c10869c579}
      - AT_SENDER_ID=${AT_SENDER_ID:-}
      - FCM_SERVER_KEY=${FCM_SERVER_KEY:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
    depends_on:
      - postgres
      - redis
    command: bash -lc "celery -A celery_app.celery_app worker --loglevel=INFO"

  alert-beat:
    build:
      context: ./backend/alert_service
    volumes:
      - ./backend/alert_service:/app
    environment:
      - DATABASE_URL=postgresql+psycopg2://AdminDb:Ngojakwanza@postgres:5432/car_platform
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - USER_SERVICE_URL=http://user-service:8001
      - BOOKING_SERVICE_URL=http://booking-service:8004
      - INSURANCE_SERVICE_URL=http://insurance-service:8005
    depends_on:
      - redis
      - user-service
      - booking-service
      - insurance-service
    command: bash -lc "celery -A celery_app.celery_app beat --loglevel=INFO"

  expenses-service:
    build:
      context: ./backend/expenses_service
    volumes:
      - ./backend/expenses_service:/app
    ports:
      - "8007:8007"
    environment:
      - DATABASE_URL=postgresql+psycopg2://AdminDb:Ngojakwanza@postgres:5432/car_platform
      - DB_HOST=postgres
      - DB_NAME=car_platform
      - DB_USER=AdminDb
      - DB_PASSWORD=Ngojakwanza
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8007/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  social-service:
    build:
      context: ./backend/social_service
      dockerfile: Dockerfile
    volumes:
      - ./backend/social_service:/app
      - ./backend/seedAssets:/app/seedAssets
    ports:
      - "8008:8008"
    environment:
      - DATABASE_URL=postgresql+psycopg2://AdminDb:Ngojakwanza@postgres:5432/car_platform
      - DB_HOST=postgres
      - DB_NAME=car_platform
      - DB_USER=AdminDb
      - DB_PASSWORD=Ngojakwanza
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY=supersecret
      - ALLOWED_ORIGINS=*
      - ENABLE_CONTENT_MODERATION=true
      - ENABLE_ANALYTICS=true
      - ENABLE_NOTIFICATIONS=true
      - RATE_LIMIT_ENABLED=true
      - MEDIA_STORAGE_TYPE=cloudflare
      - MEDIA_UPLOAD_PATH=/app/uploads
      - MAX_FILE_SIZE=10485760
      - ALLOWED_IMAGE_TYPES=image/jpeg,image/png,image/gif,image/webp
      - ALLOWED_VIDEO_TYPES=video/mp4,video/webm,video/quicktime
      - ANALYTICS_RETENTION_DAYS=90
      - RATE_LIMIT_REQUESTS_PER_MINUTE=60
      - PUSH_NOTIFICATION_ENABLED=true
      - CLOUDFLARE_ACCOUNT_ID=4739f91ba1dc08d51ef1d0e905c95da7
      - CLOUDFLARE_ACCESS_KEY_ID=1c2c27b577ed7c83ab8c17baf76fc50c
      - CLOUDFLARE_SECRET_ACCESS_KEY=4351417510a2f068ffa87ea703e5afb68f05ae10efdd8155d1071097143363b1
      - CLOUDFLARE_BUCKET=driveon-social-media
      - CLOUDFLARE_PUBLIC_URL=https://pub-4739f91ba1dc08d51ef1d0e905c95da7.r2.dev
      - MODERATION_API_KEY=your-moderation-api-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8008/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  
  gateway:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:8000"
    depends_on:
      user-service:
        condition: service_started
      vehicle-service:
        condition: service_started
      service-provider:
        condition: service_started
      booking-service:
        condition: service_started
      insurance-service:
        condition: service_started
      alert-service:
        condition: service_started
      expenses-service:
        condition: service_started
      social-service:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
