services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: AdminDb
      POSTGRES_PASSWORD: Ngojakwanza
      POSTGRES_DB: car_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U AdminDb -d car_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./backend/user_service
      dockerfile: Dockerfile
    volumes:
      - ./backend/user_service:/app
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+psycopg2://AdminDb:Ngojakwanza@postgres:5432/car_platform
      - DB_HOST=postgres
      - DB_NAME=car_platform
      - DB_USER=AdminDb
      - DB_PASSWORD=Ngojakwanza
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  gateway:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:8000"
    depends_on:
      user-service:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
